      <path d="M30 0H60V30H30Z M0 30H30V60H0Z M60 60H90V90H60Z" fill="#a28cc9"/>
      <path d="M60 0H90V30H60Z M30 30H60V60H30Z M0 60H30V90H0Z" fill="#7c98b1"/>
