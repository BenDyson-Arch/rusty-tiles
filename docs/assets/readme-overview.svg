      <circle cx="31" cy="61" r="2.6"/><circle cx="43" cy="53" r="2.4"/><circle cx="53" cy="65" r="2.8"/>
      <circle cx="62" cy="48" r="2.4"/><circle cx="73" cy="40" r="2.8"/><circle cx="86" cy="30" r="2.4"/>
      <circle cx="82" cy="54" r="2.6"/><circle cx="95" cy="50" r="2.4"/><circle cx="100" cy="61" r="2.8"/>
      <circle cx="71" cy="68" r="2.4"/><circle cx="83" cy="73" r="2.8"/>
