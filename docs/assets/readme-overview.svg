<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="252" viewBox="0 0 1040 252" role="img" aria-labelledby="title desc">
  <title id="title">Input formats and tile outputs</title>
  <desc id="desc">Meshes, point clouds and vectors become 3D Tiles archives. Imagery becomes COG and XYZ tiles; elevation becomes quantized-mesh terrain.</desc>
