<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
  <title id="title">Geospatial files, made into tiles</title>
  <desc id="desc">Meshes, point clouds and vectors become 3D Tiles archives. Imagery becomes COG and XYZ tiles; elevation becomes quantized-mesh terrain. Try a mesh: doctor, mesh-to-3tz, validate, then preview.</desc>
