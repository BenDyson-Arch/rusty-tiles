[package]
name = "rusty-tiles-python"
version.workspace = true
edition = "2021"
publish = false
license = "MIT"
description = "Self-contained Python bindings for rusty-tiles"
repository = "https://github.com/BenDyson-Arch/rusty-tiles"

[lib]
name = "rusty_tiles"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
tiles-core = { package = "rusty-tiles", path = "../..", default-features = false }
serde_json = "1"
