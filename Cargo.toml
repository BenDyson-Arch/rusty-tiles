[package]
name = "rusty-tiles"
version = "0.2.0"
edition = "2021"
description = "Standalone geospatial tiling: textured meshes, imagery, terrain, LAS/LAZ point clouds and glTF vectors."
license = "MIT"
readme = "README.md"
include = ["/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/build.rs", "/src/**", "/scripts/*.py", "/scripts/*.sh", "/scripts/*requirements.txt", "/preview/**", "/tests/*.rs", "/tests/*.py", "/tests/fixtures/**", "/docs/**"]

[[bin]]
name = "rusty-tiles"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
gltf-json = { version = "=1.4.1", features = ["extensions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false }
walkdir = "2"
crc32fast = "1"
md5 = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder = { version = "0.3", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
meshopt = "0.6"
rayon = "1.10"
zenwebp = "0.4"

tempfile = "3"
sha2 = "0.10"
jsonschema = { version = "0.33", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
zip = { version = "2", default-features = false }
