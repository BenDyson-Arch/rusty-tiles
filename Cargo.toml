[package]
name = "rusty-tiles"
version.workspace = true
edition = "2021"
description = "Standalone geospatial tiling: textured meshes, imagery, terrain, LAS/LAZ point clouds and glTF vectors."
license = "MIT"
repository = "https://github.com/BenDyson-Arch/rusty-tiles"
readme = "README.md"
include = ["/Cargo.toml", "/Cargo.lock", "/Dockerfile", "/.dockerignore", "/LICENSE", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/build.rs", "/src/**", "/scripts/*.sh", "/scripts/*requirements.txt", "/preview/**", "/tests/*.rs", "/tests/support/*.rs", "/tests/*.py", "/tests/fixtures/**", "/docs/**", "/bench/**"]

[workspace]
members = ["bindings/python"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.3.0"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "rusty-tiles"
path = "src/main.rs"

[[example]]
name = "demodata-suite"
path = "bench/demodata_suite.rs"
required-features = ["native-geospatial"]

[features]
default = []
native-jpeg = []
native-geospatial = ["dep:gdal-sys", "dep:pkg-config", "dep:rusqlite"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
gltf-json = { version = "=1.4.1", features = ["extensions"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
zip = { version = "2", default-features = false }
walkdir = "2"
crc32fast = "1"
md5 = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder = { version = "0.3", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
meshopt = "0.6"
rayon = "1.10"
zenwebp = "0.4"

tempfile = "3"
sha2 = "0.10"
jsonschema = { version = "0.33", default-features = false }
gdal-sys = { version = "0.12", features = ["bindgen"], optional = true }
las = { version = "0.11.1", features = ["laz"] }
rusqlite = { version = "0.40", optional = true }
tiny_http = "0.12.0"
percent-encoding = "2.3.2"
bitvec = { version = "1.1", default-features = false, features = ["std"] }
morton-encoding = "2.0"

[build-dependencies]
pkg-config = { version = "0.3", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
zip = { version = "2", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
