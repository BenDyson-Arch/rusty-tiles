name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 15 # versions: TIMEOUT_GATE
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        name: Match the tag to Cargo.toml and main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rusty-tiles"))')
          test "$RELEASE_TAG" = "v$version"
          git merge-base --is-ancestor HEAD origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo 'prerelease=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'prerelease=false' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Require the full CI matrix for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -eu
          # Pull-request runs only cover the fast Linux tier, so they never count. A qualifying
          # run is a successful push, nightly or manual run of ci.yml on this exact commit in
          # which both "Full matrix" (every job, including the five-platform and wheel jobs) and
          # "Rust" succeeded. A docs-only push skips the matrix and does not qualify.
          runs=$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" --status success --limit 100 \
            --json databaseId,event --jq '.[] | select(.event != "pull_request") | .databaseId')
          for run in $runs; do
            passed=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${run}/jobs" \
              --jq '.jobs[] | select(.conclusion == "success") | .name')
            if printf '%s\n' "$passed" | grep -Fxq 'Full matrix' && printf '%s\n' "$passed" | grep -Fxq 'Rust'; then
              echo "Full CI matrix passed for $RELEASE_SHA in run $run"
              exit 0
            fi
          done
          echo "::error::no successful full-matrix CI run for $RELEASE_SHA; wait for the push run on main to finish (or dispatch ci.yml on this commit), then re-run this workflow"
          exit 1
      - name: Test the checksum-verifying installer
        run: python3 -m unittest discover -s tests -p test_install.py -v

  build:
    name: Build
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.check.outputs.version }}
      image-tag: ${{ github.ref_name }}

  wheels:
    name: Python wheel acceptance
    needs: check
    uses: ./.github/workflows/wheel-acceptance.yml

  pypi:
    name: Publish Python wheels to PyPI
    needs: [check, build, wheels]
    # PyPI uploads cannot be replaced; release candidates stay on GitHub only.
    if: needs.check.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # versions: TIMEOUT_PUBLISH
    environment:
      name: pypi
      url: https://pypi.org/project/rusty-tiles/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

  publish:
    name: Publish release
    needs: [check, build, wheels, pypi]
    # A prerelease skips PyPI; anything else needs PyPI to have succeeded.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.wheels.result == 'success' &&
      (needs.pypi.result == 'success' || (needs.pypi.result == 'skipped' && needs.check.outputs.prerelease == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # versions: TIMEOUT_PUBLISH
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Attach checksums and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -eu
          cd dist
          sha256sum *.tgz *.zip > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./*.tgz ./*.zip SHA256SUMS --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            image="ghcr.io/${GH_REPO,,}"
            printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker buildx imagetools create -t "$image:latest" "$image:$RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
