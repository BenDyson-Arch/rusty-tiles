name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libturbojpeg0-dev
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Test native build
        run: cargo test --locked
      - name: Test portable JPEG
        env:
          RUSTY_TILES_DISABLE_NATIVE_JPEG: '1'
        run: cargo test --locked --lib jpeg::tests

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: derivatives
          create-args: >-
            python=3.12
            gdal=3.12
            numpy=2
            -c conda-forge
          init-shell: bash
      - name: Build CLI for derivative acceptance
        shell: bash -el {0}
        run: cargo build --locked
      - name: Test derivative encoding and preview isolation
        shell: bash -el {0}
        run: |
          python -c "from osgeo import gdal; print(gdal.VersionInfo('--version'))"
          RUSTY_TILES_BIN="$PWD/target/debug/rusty-tiles" python -m unittest discover -s tests -p 'test_*.py'
