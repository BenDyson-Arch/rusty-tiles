          python3 -B tests/f1d1_viewer.py --source "${{ runner.temp }}/f1d2-artifacts/baseline/viewer/source.glb" \
            --archive "${{ runner.temp }}/f1d2-artifacts/baseline/viewer/result.3tz" \
            --cesium-dir target/terrain-browser/node_modules/cesium/Build/Cesium \
            --node-modules target/terrain-browser/node_modules --chromium "$CHROMIUM" \
            --json-output "${{ runner.temp }}/f1d1-browser.json"
      - name: Prove placed root proxy traversal with independent WGS84 cameras
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
