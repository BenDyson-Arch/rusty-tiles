name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libturbojpeg0-dev
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test native build
        run: cargo test --locked --features native-jpeg
      - name: Check source packaging
        run: cargo package --locked --no-verify
      - name: Test portable JPEG
        env:
          RUSTY_TILES_DISABLE_NATIVE_JPEG: '1'
        run: cargo test --locked --lib jpeg::tests

  python-wheel:
    name: Python wheel (CPython ${{ matrix.python }})
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    env:
      RUSTY_TILES_DISABLE_NATIVE_JPEG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check wheel acceptance failure handling
        run: python -m unittest discover -s tests -p test_wheel_runners.py -v
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: python-wheel-${{ matrix.python }}
      - name: Check Python bindings
        run: cargo clippy --locked -p rusty-tiles-python -- -D warnings
      - name: Build wheel
        run: |
          python -m pip install 'maturin==1.15.0'
          maturin build --release --locked --out target/wheels
      - name: Test the installed wheel with an empty PATH
        run: python scripts/test_python_wheel.py target/wheels/*.whl

  portable:
    name: Portable CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      RUSTY_TILES_DISABLE_NATIVE_JPEG: '1'
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "$RELEASE_TARGET"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: portable-${{ matrix.target }}
      - name: Test the portable release CLI
        run: cargo test --locked --target "$RELEASE_TARGET"

  native-geospatial:
    name: Native geospatial (GDAL ${{ matrix.gdal }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gdal: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install binding build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libclang-dev libsqlite3-dev
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: native-geospatial
          create-args: >-
            libgdal-core=${{ matrix.gdal }}
            proj>=9.2
            -c conda-forge
          init-shell: bash
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: gdal-${{ matrix.gdal }}
      - name: Test native geospatial build
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '1'
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --locked --features native-geospatial
      - name: Check native geospatial lint
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '1'
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          rustup component add clippy
          cargo clippy --locked --all-targets --features native-geospatial -- -D warnings

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTY_TILES_REQUIRE_BIN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: derivatives
          create-args: >-
            python=3.12
            gdal=3.12
            numpy=2
            laspy>=2.6,<3
            lazrs-python
            pyproj>=3.7,<4
            -c conda-forge
          init-shell: bash
      - name: Install binding build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libsqlite3-dev
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: python-gdal-3.12
      - name: Build CLI for derivative acceptance
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '1'
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo build --locked --features native-geospatial
      - name: Test derivative encoding and preview isolation
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python -c "from osgeo import gdal; print(gdal.VersionInfo('--version'))"
          RUSTY_TILES_BIN="$PWD/target/debug/rusty-tiles" python -m unittest discover -s tests -p 'test_*.py'
      - name: Test portable vectors against independent fixtures and Python oracle
        shell: bash -el {0}
        run: |
          cargo build --locked
          RUSTY_TILES_BIN="$PWD/target/debug/rusty-tiles" python -m unittest discover -s tests -p 'test_vector_*.py'
          RUSTY_TILES_BIN="$PWD/target/debug/rusty-tiles" python -m unittest discover -s tests -p 'test_native_vector.py'

  python-free-runtime:
    name: Python-free runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Test installed native suite in a runtime image without Python
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: acceptance
          outputs: type=cacheonly
          # Always execute the suite, including when build artifacts are cached.
          no-cache-filters: acceptance
          cache-from: type=gha,scope=python-free-acceptance
          cache-to: type=gha,scope=python-free-acceptance,mode=max
      - name: Build and check packaged runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          load: true
          tags: rusty-tiles:native
          # The acceptance export includes this target's SDK and Rust build.
          cache-from: type=gha,scope=python-free-acceptance
      - name: Check runtime without network access
        run: docker run --rm --network none rusty-tiles:native doctor --json

  release-acceptance:
    name: Release acceptance
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install binding build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libclang-dev libsqlite3-dev curl
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: release-acceptance
          create-args: >-
            python=3.12
            gdal=3.12
            numpy=2
            laspy>=2.6,<3
            lazrs-python
            pyproj>=3.7,<4
            -c conda-forge
          init-shell: bash
      - name: Check the release CLI route
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          scripts/release_acceptance.sh
