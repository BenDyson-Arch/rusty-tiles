name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libturbojpeg0-dev
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check foundation lifecycle model and independent monitor
        run: |
          python3 bench/architecture_audit/foundation/model.py --results "${{ runner.temp }}/foundation-model.json"
          python3 -m unittest discover -s bench/architecture_audit/foundation -p test_monitor.py -v
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test native build
        run: cargo test --locked --features native-jpeg
      - name: Independently check validation controls and finite work
        run: |
          python3 -B tests/c1_validation_oracle.py --generate "${{ runner.temp }}/c1-fixtures" --binary target/debug/rusty-tiles --output "${{ runner.temp }}/c1-validation.json"
          python3 -B bench/architecture_audit/c1/resource_probe.py --binary target/debug/rusty-tiles --work "${{ runner.temp }}/c1-resources" --output "${{ runner.temp }}/c1-resources.json"
          python3 -B tests/c1_producer_alignment.py --binary target/debug/rusty-tiles --work "${{ runner.temp }}/c1-producer" --output "${{ runner.temp }}/c1-producer.json"
      - name: Retain validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c1-validation-evidence
          path: ${{ runner.temp }}/c1-*.json
          if-no-files-found: error
      - name: Independently decode local mesh candidates and corruption controls
        run: python3 -B tests/f1a_oracle.py --binary target/debug/rusty-tiles
      - name: Independently verify mesh texture fidelity and image closure
        run: |
          python3 -B tests/f1b_oracle.py --binary target/debug/rusty-tiles --json-output "${{ runner.temp }}/f1b-textures.json"
          python3 -B tests/f1b2_oracle.py --binary target/debug/rusty-tiles --json-output "${{ runner.temp }}/f1b-local-resources.json"
          python3 -B tests/f1b3_oracle.py --binary target/debug/rusty-tiles --json-output "${{ runner.temp }}/f1b-core-pbr.json"
          python3 -B bench/architecture_audit/f1b1/resource_probe.py --binary target/debug/rusty-tiles --output "${{ runner.temp }}/f1b-resources.json"
          python3 -B bench/architecture_audit/f1b2/resource_probe.py --binary target/debug/rusty-tiles --output "${{ runner.temp }}/f1b-local-resource-bounds.json"
          python3 -B bench/architecture_audit/f1b3/resource_probe.py --binary target/debug/rusty-tiles --output "${{ runner.temp }}/f1b-core-pbr-bounds.json"
      - name: Independently verify explicit placement and world bounds
        run: |
          python3 -B tests/f1c1_oracle.py --binary target/debug/rusty-tiles --json-output "${{ runner.temp }}/f1c1-placement.json"
          python3 -B bench/architecture_audit/f1c1/resource_probe.py --binary target/debug/rusty-tiles --binary-sha256 "$(sha256sum target/debug/rusty-tiles | cut -d ' ' -f 1)" --output "${{ runner.temp }}/f1c1-resources.json"
      - name: Retain placement evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1c1-placement-evidence
          path: ${{ runner.temp }}/f1c1-*.json
          if-no-files-found: error
      - name: Independently verify source identity and metadata association
        run: python3 -B tests/f1c2_oracle.py --self-test --binary target/debug/rusty-tiles --large --json-output "${{ runner.temp }}/f1c2-identity.json"
      - name: Independently verify exact model bytes and original-node bounds
        run: python3 -B tests/model_wrapping_oracle.py --binary target/debug/rusty-tiles --json-output "${{ runner.temp }}/f1c2-wrapping.json"
      - name: Retain source identity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1c2-identity-evidence
          path: ${{ runner.temp }}/f1c2-*.json
          if-no-files-found: error
      - name: Retain mesh texture evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1b-texture-evidence
          path: ${{ runner.temp }}/f1b-*.json
          if-no-files-found: error
      - name: Independently verify vector acceptance and archive inventory
        run: python3 -B tests/vector_acceptance_oracle.py --binary target/debug/rusty-tiles --evidence "${{ runner.temp }}/vector-acceptance"
      - name: Independently verify point records, rendered placement and hierarchy
        run: python3 -B tests/p1_point_oracle.py --binary target/debug/rusty-tiles --output-dir "${{ runner.temp }}/point-acceptance" --json-output "${{ runner.temp }}/point-acceptance.json"
      - name: Check source packaging
        run: cargo package --locked --no-verify
      - name: Test portable JPEG
        env:
          RUSTY_TILES_DISABLE_NATIVE_JPEG: '1'
        run: cargo test --locked --lib jpeg::tests

  python-wheel:
    name: Python wheel (CPython ${{ matrix.python }})
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    env:
      RUSTY_TILES_DISABLE_NATIVE_JPEG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check wheel acceptance failure handling
        run: python -m unittest discover -s tests -p test_wheel_runners.py -v
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: python-wheel-${{ matrix.python }}
      - name: Check Python bindings
        run: cargo clippy --locked -p rusty-tiles-python -- -D warnings
      - name: Test Python error and recovery mappings
        run: cargo test --locked -p rusty-tiles-python
      - name: Build wheel
        run: |
          python -m pip install 'maturin==1.15.0'
          maturin build --release --locked --out target/wheels
      - name: Test the installed wheel with an empty PATH
        run: python scripts/test_python_wheel.py target/wheels/*.whl

  portable:
    name: Portable CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      RUSTY_TILES_DISABLE_NATIVE_JPEG: '1'
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "$RELEASE_TARGET"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: portable-${{ matrix.target }}
      - name: Test the portable release CLI
        run: cargo test --locked --target "$RELEASE_TARGET"

  native-geospatial:
    name: Native geospatial (GDAL ${{ matrix.gdal }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gdal: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install binding build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libclang-dev libsqlite3-dev
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: native-geospatial
          create-args: >-
            libgdal-core=${{ matrix.gdal }}
            proj>=9.2
            -c conda-forge
          init-shell: bash
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: gdal-${{ matrix.gdal }}
      - name: Test native geospatial build
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '1'
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --locked --features native-geospatial
      - name: Independently verify native vector and point acceptance
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 -B tests/vector_acceptance_oracle.py --binary target/debug/rusty-tiles --evidence "${{ runner.temp }}/vector-acceptance-native" --native
          python3 -B tests/p1_point_oracle.py --binary target/debug/rusty-tiles --output-dir "${{ runner.temp }}/point-acceptance-native" --json-output "${{ runner.temp }}/point-acceptance-native.json"
      - name: Check native geospatial lint
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '1'
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          rustup component add clippy
          cargo clippy --locked --all-targets --features native-geospatial -- -D warnings

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTY_TILES_REQUIRE_BIN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: derivatives
          create-args: >-
            python=3.12
            gdal=3.12
            numpy=2
            laspy>=2.6,<3
            lazrs-python
            pyproj>=3.7,<4
            -c conda-forge
          init-shell: bash
      - name: Install binding build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libsqlite3-dev
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: python-gdal-3.12
      - name: Build CLI for derivative acceptance
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '1'
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo build --locked --features native-geospatial
      - name: Independently prove D1 raster pixels and directory closure
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 -B tests/d1_raster_oracle.py target/debug/rusty-tiles
          python3 -B tests/d2_directory_oracle.py target/debug/rusty-tiles
      - name: Test derivative encoding and preview isolation
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python -c "from osgeo import gdal; print(gdal.VersionInfo('--version'))"
          RUSTY_TILES_BIN="$PWD/target/debug/rusty-tiles" python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned terrain consumer
        run: |
          npm install --prefix target/terrain-browser --no-save --package-lock=false cesium@1.146.0 three@0.180.0 playwright@1.63.0 gltf-validator@2.0.0-dev.3.10
          target/terrain-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Independently verify validator positive geometry controls
        run: python3 -B tests/c1_khronos_oracle.py --node-modules target/terrain-browser/node_modules --output "${{ runner.temp }}/c1-official-positive.json"
      - name: Validate independent core PBR sources and emitted leaves with Khronos
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 -B tests/f1b3_khronos.py --binary target/debug/rusty-tiles \
            --validator-modules target/terrain-browser/node_modules --source-commit "${{ github.sha }}" \
            --json-output "${{ runner.temp }}/f1b-core-pbr-khronos.json"
      - name: Validate source identity leaves and format controls with Khronos
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 -B tests/f1c2_khronos.py --binary target/debug/rusty-tiles \
            --validator-modules target/terrain-browser/node_modules \
            --json-output "${{ runner.temp }}/f1c2-khronos.json"
      - name: Prove terrain rendering, queries, clamping and imagery draping
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export CHROMIUM=$(node -e "console.log(require('./target/terrain-browser/node_modules/playwright').chromium.executablePath())")
          python3 -B tests/t1_terrain_viewer.py --binary target/debug/rusty-tiles \
            --cesium-dir target/terrain-browser/node_modules/cesium/Build/Cesium \
            --node-modules target/terrain-browser/node_modules \
            --json-output "${{ runner.temp }}/terrain-browser.json"
      - name: Prove local mesh texture appearance and routing
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export CHROMIUM=$(node -e "console.log(require('./target/terrain-browser/node_modules/playwright').chromium.executablePath())")
          python3 -B tests/f1a_viewer.py --binary target/debug/rusty-tiles \
            --cesium-dir target/terrain-browser/node_modules/cesium/Build/Cesium \
            --node-modules target/terrain-browser/node_modules \
            --json-output "${{ runner.temp }}/f1b-routing.json"
          python3 -B tests/f1b_viewer.py --binary target/debug/rusty-tiles \
            --cesium-dir target/terrain-browser/node_modules/cesium/Build/Cesium \
            --node-modules target/terrain-browser/node_modules \
            --json-output "${{ runner.temp }}/f1b-appearance.json"
          python3 -B tests/f1b_viewer.py --binary target/debug/rusty-tiles --external-resources \
            --cesium-dir target/terrain-browser/node_modules/cesium/Build/Cesium \
            --node-modules target/terrain-browser/node_modules \
            --json-output "${{ runner.temp }}/f1b-resource-appearance.json"
          python3 -B tests/f1b3_viewer.py --binary target/debug/rusty-tiles \
            --three-dir target/terrain-browser/node_modules/three \
            --node-modules target/terrain-browser/node_modules --chromium "$CHROMIUM" \
            --json-output "${{ runner.temp }}/f1b-core-pbr-appearance.json"
      - name: Prove emitted Earth placement without viewer corrections
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export CHROMIUM=$(node -e "console.log(require('./target/terrain-browser/node_modules/playwright').chromium.executablePath())")
          python3 -B tests/f1c1_viewer.py --binary target/debug/rusty-tiles \
            --cesium-dir target/terrain-browser/node_modules/cesium/Build/Cesium \
            --node-modules target/terrain-browser/node_modules --chromium "$CHROMIUM" \
            --json-output "${{ runner.temp }}/f1c1-browser.json"
      - name: Prove source primitive and triangle picking
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export CHROMIUM=$(node -e "console.log(require('./target/terrain-browser/node_modules/playwright').chromium.executablePath())")
          python3 -B tests/f1c2_viewer.py --binary target/debug/rusty-tiles \
            --cesium-dir target/terrain-browser/node_modules/cesium/Build/Cesium \
            --node-modules target/terrain-browser/node_modules --chromium "$CHROMIUM" \
            --json-output "${{ runner.temp }}/f1c2-browser.json"
          python3 -B tests/f1c2_viewer.py --binary target/debug/rusty-tiles --empty-names \
            --cesium-dir target/terrain-browser/node_modules/cesium/Build/Cesium \
            --node-modules target/terrain-browser/node_modules --chromium "$CHROMIUM" \
            --json-output "${{ runner.temp }}/f1c2-empty-names-browser.json"
      - name: Prove unchanged model traversal, resources and placement
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export CHROMIUM=$(node -e "console.log(require('./target/terrain-browser/node_modules/playwright').chromium.executablePath())")
          python3 -B bench/architecture_audit/f1c2/review_probes/unchanged_model_browser.py \
            --binary target/debug/rusty-tiles --node-modules target/terrain-browser/node_modules \
            --chromium "$CHROMIUM" --output "${{ runner.temp }}/f1c2-wrapping-browser.json"
      - name: Retain source identity and model consumer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1c2-browser-evidence
          path: ${{ runner.temp }}/f1c2-*.json
          if-no-files-found: error
      - name: Retain placed mesh consumer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1c1-browser-evidence
          path: ${{ runner.temp }}/f1c1-browser.json
          if-no-files-found: error
      - name: Retain mesh consumer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1b-browser-evidence
          path: ${{ runner.temp }}/f1b-*.json
          if-no-files-found: error
      - name: Independently verify native LAZ delivery
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python -B tests/p1_laz_adapter.py --binary "$PWD/target/debug/rusty-tiles" --json-output "${{ runner.temp }}/point-laz-native.json"
      - name: Upload terrain consumer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terrain-browser-evidence
          path: ${{ runner.temp }}/terrain-browser.json
          if-no-files-found: error
      - name: Test portable vectors against independent fixtures and Python oracle
        shell: bash -el {0}
        run: |
          cargo build --locked
          RUSTY_TILES_BIN="$PWD/target/debug/rusty-tiles" python -m unittest discover -s tests -p 'test_vector_*.py'
          RUSTY_TILES_BIN="$PWD/target/debug/rusty-tiles" python -m unittest discover -s tests -p 'test_native_vector.py'
          python -B tests/p1_laz_adapter.py --binary "$PWD/target/debug/rusty-tiles" --json-output "${{ runner.temp }}/point-laz-portable.json"

  python-free-runtime:
    name: Python-free runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and check packaged runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          load: true
          tags: rusty-tiles:native
          cache-from: type=gha,scope=python-free-acceptance
          cache-to: type=gha,scope=python-free-acceptance,mode=max
      - name: Test packaged conversions without Python or network access
        run: |
          docker run --rm --network none \
            --mount type=bind,src="$PWD/tests/fixtures",dst=/fixtures,readonly \
            --mount type=bind,src="$PWD/scripts/test-packaged-runtime.sh",dst=/test-packaged-runtime.sh,readonly \
            --entrypoint /bin/sh rusty-tiles:native /test-packaged-runtime.sh /fixtures

  release-acceptance:
    name: Release acceptance
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACCEPTANCE_REQUIRE_BROWSER: '1'
      ACCEPTANCE_WORK: ${{ github.workspace }}/target/release-acceptance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install binding build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libclang-dev libsqlite3-dev curl
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: release-acceptance
          create-args: >-
            python=3.12
            gdal=3.12
            numpy=2
            laspy>=2.6,<3
            lazrs-python
            pyproj>=3.7,<4
            -c conda-forge
          init-shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned browser acceptance runtime
        run: |
          npm install --prefix target/release-browser --no-save --package-lock=false cesium@1.146.0 playwright@1.63.0
          target/release-browser/node_modules/.bin/playwright install --with-deps chromium
          echo "NODE_PATH=$PWD/target/release-browser/node_modules" >> "$GITHUB_ENV"
          echo "CESIUM_DIR=$PWD/target/release-browser/node_modules/cesium/Build/Cesium" >> "$GITHUB_ENV"
          acceptance_chromium=$(node -e "console.log(require('./target/release-browser/node_modules/playwright').chromium.executablePath())")
          echo "CHROMIUM=$acceptance_chromium" >> "$GITHUB_ENV"
      - name: Check release acceptance failure handling
        run: python3 -m unittest discover -s tests -p test_release_acceptance.py -v
      - name: Check the release CLI route
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          scripts/release_acceptance.sh
      - name: Retain release acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-acceptance
          path: target/release-acceptance
          if-no-files-found: warn
