          python3 -B tests/f1b_viewer.py --binary target/debug/rusty-tiles --external-resources \
            --cesium-dir target/terrain-browser/node_modules/cesium/Build/Cesium \
            --node-modules target/terrain-browser/node_modules \
            --json-output "${{ runner.temp }}/f1b-resource-appearance.json"
          python3 -B tests/f1b3_viewer.py --binary target/debug/rusty-tiles \
            --three-dir target/terrain-browser/node_modules/three \
            --node-modules target/terrain-browser/node_modules --chromium "$CHROMIUM" \
            --json-output "${{ runner.temp }}/f1b-core-pbr-appearance.json"
      - name: Prove emitted Earth placement without viewer corrections
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export CHROMIUM=$(node -e "console.log(require('./target/terrain-browser/node_modules/playwright').chromium.executablePath())")
          python3 -B tests/f1c1_viewer.py --binary target/debug/rusty-tiles \
            --cesium-dir target/terrain-browser/node_modules/cesium/Build/Cesium \
            --node-modules target/terrain-browser/node_modules --chromium "$CHROMIUM" \
            --json-output "${{ runner.temp }}/f1c1-browser.json"
      - name: Prove source primitive and triangle picking
        shell: bash -el {0}
        run: |
