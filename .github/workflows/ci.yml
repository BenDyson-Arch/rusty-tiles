name: CI

# Two tiers (see "CI tiers" in CONTRIBUTING.md). Pull requests run the fast tier: Change
# scope, Rust, Python, native geospatial for the newest GDAL and the Windows portable CLI
# (with the build version it packages). Pushes to main and develop, nightly runs (dispatched
# by nightly.yml) and manual runs also run every other job, and so do pull requests into
# main, pull requests labelled full-ci and pull requests that change build, platform or CI
# files (scripts/ci_scope.py, ci/full-tier-paths.txt).
on:
  push:
    branches: [main, develop]
  pull_request:
    # labeled: adding full-ci reruns the pull request with the full tier.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      nightly:
        description: Report this run to its branch's "Full CI matrix failing on <branch>" tracking issue
        type: boolean
        default: false

permissions:
  contents: read

# Dispatched runs have their own group so a push cannot cancel the nightly run (or the reverse).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # versions: TIMEOUT_SHORT
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      # 'false' only when sure: a failed classifier runs the full tier.
      full: ${{ steps.scope.outputs.full }}
    steps:
      # The whole tree (shallow): ci_scope.py reads each changed Rust file for platform code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Docs-only means every changed path is Markdown under docs/ or changelog.d/
      # or at the repository root. Markdown under bench/ and tests/ is hashed by oracles,
      # so it counts as code, and so does any removal or rename (a missing
      # README.md breaks cargo package). Any doubt (manual runs, new branches, API errors,
      # truncated file lists) runs the full workflow. A pull request that is not docs-only
      # runs the full tier when scripts/ci_scope.py says so; other events always do.
      - name: Classify changed paths
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          docs_only=false
          compare="$RUNNER_TEMP/compare.json"
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] && [ "${BASE#0000000}" = "$BASE" ] \
            && gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" > "$compare"; then
            if files=$(jq -r '.files[] | if (.status == "added" or .status == "modified") then .filename else "!" + .filename end' "$compare") \
              && [ -n "$files" ] && [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ] \
              && ! printf '%s\n' "$files" | grep -qvE '^(docs/.*|changelog\.d/[^/]+|[^/]+)\.md$'; then
              docs_only=true
            fi
          fi
          printf '%s\n' "${files:-}"
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"
          if [ "$docs_only" = true ]; then
            echo 'full=false' | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ]; then
            # Labels from the API, not the event payload, so a re-run sees a label added later.
            labels=(); names=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" --jq '.[].name') || names=full-ci
            while IFS= read -r name; do if [ -n "$name" ]; then labels+=(--label "$name"); fi; done <<< "$names"
            python3 -I scripts/ci_scope.py full "$compare" --root "$GITHUB_WORKSPACE" --base "$BASE_REF" "${labels[@]}" | tee -a "$GITHUB_OUTPUT"
          else
            echo 'full=true' | tee -a "$GITHUB_OUTPUT"
          fi

  docs:
    name: Docs-only checks
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # versions: TIMEOUT_SHORT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check tracked size budget
        run: python3 scripts/check_tree_budget.py
      - name: Check changelog fragments
        run: python3 scripts/changelog.py check

  rust:
    name: Rust
    needs: changes
    # Skipped jobs satisfy required checks; a failed classifier runs everything.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50 # versions: TIMEOUT_RUST
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Free runner disk
        # Hosted runners start with ~20 GB free; large test links fail with
        # "ld terminated with signal 7 [Bus error]" when it runs out. Remove
        # preinstalled toolchains these jobs never use.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/julia* /usr/share/swift
          df -h /
      - name: Check tracked size budget
        run: python3 scripts/check_tree_budget.py
      - name: Check CI versions and time limits against ci/versions.env
        run: |
          python3 -I -m unittest discover -s tests -p test_ci_config.py
          python3 -I scripts/check_ci_config.py
      - name: Check changelog fragments
        run: |
          python3 -I scripts/test_changelog.py
          python3 scripts/changelog.py check
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
      # Only develop and main write Rust caches; pull requests restore their base branch's
      # cache and no longer evict it (the repository's cache space is shared).
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      - name: Check Rust third-party licence files and allow-list
        # Seconds: cargo tree and metadata only, nothing is compiled.
        run: |
          python3 -I scripts/test_third_party_licenses.py
          python3 scripts/third_party_licenses.py check
      - name: Check foundation lifecycle model and independent monitor
        run: |
          python3 bench/architecture_audit/foundation/model.py --results "${{ runner.temp }}/foundation-model.json"
          python3 -m unittest discover -s bench/architecture_audit/foundation -p test_monitor.py -v
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test performance-lane controls
        run: |
          node --version
          python3 -I bench/perf_lane/test_report.py
          python3 -I bench/perf_lane/test_cesium.py
          python3 -I bench/perf_lane/test_flythrough.py
      - name: Check the crate package size and third-party notices
        run: |
          cargo package --locked --no-verify
          python3 scripts/third_party_notices.py check --rust-licenses all --max-bytes 10000000 target/package/rusty-tiles-*.crate
      - name: Test default build
        shell: bash
        run: |
          # Library unit tests run in parallel, except two that run serially below: the C1
          # context controls, whose stderr receipt lines must not interleave, and a test that
          # changes the process working directory. Bins, integration tests (several change the
          # working directory) and doctests stay serial.
          serial_lib=(payload_context_acceptance:: vector_compression::tests::callback_cwd_change_cannot_redirect_relative_source_or_publication)
          skips=(); for name in "${serial_lib[@]}"; do skips+=(--skip "$name"); done
          cargo test --locked --lib -- "${skips[@]}"
          cargo test --locked --lib -- --nocapture --test-threads=1 "${serial_lib[@]}" 2>&1 | tee "${{ runner.temp }}/c1-library.log"
          cargo test --locked --bins --test '*' -- --nocapture --test-threads=1 2>&1 | tee -a "${{ runner.temp }}/c1-library.log"
          cargo test --locked --doc -- --test-threads=1 2>&1 | tee -a "${{ runner.temp }}/c1-library.log"
          python3 -B tests/payload_context_receipt.py --log "${{ runner.temp }}/c1-library.log" --output "${{ runner.temp }}/c1-payload-contexts.json"
      - name: Check streamed forest memory alone
        run: cargo test --locked --lib -- --ignored --exact --nocapture implicit::tileset::records_tests::streamed_forest_memory_is_bounded_by_one_document
      - name: Independently check streamed mesh capture and tree records
        shell: bash
        run: |
          cargo test --locked --lib --no-run --message-format=json > "${{ runner.temp }}/h1-artifacts.jsonl"
          binary=$(python3 -c 'import json,sys; records=[json.loads(line) for line in open(sys.argv[1])]; print(next(r["executable"] for r in records if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="rusty_tiles" and r.get("profile",{}).get("test") and r.get("executable")))' "${{ runner.temp }}/h1-artifacts.jsonl")
          python3 -B tests/h1_tree_oracle.py self-test
          python3 -B tests/h1_tree_oracle.py run-corpus "$binary" "${{ runner.temp }}/h1-corpus" --label ci-default
          python3 -B tests/h1_tree_oracle.py run-refusals "$binary" "${{ runner.temp }}/h1-refusals" --label ci-default
          python3 -B bench/architecture_audit/mesh_large_h1/physical_scratch_probe.py --binary "$binary" --work "${{ runner.temp }}/h1-physical" --label ci-default
      - name: Retain streamed mesh acceptance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h1-capture-tree-evidence
          path: |
            ${{ runner.temp }}/h1-corpus/receipt.json
            ${{ runner.temp }}/h1-refusals/receipt.json
            ${{ runner.temp }}/h1-physical/receipt.json
          if-no-files-found: error
      - name: Re-run validator parity with the catalog on scratch (VS-A forced spill)
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/vsa-scratch"
          TMPDIR="${{ runner.temp }}/vsa-scratch" RUSTY_TILES_FORCED_SPILL=1 \
            cargo test --locked --lib -- --test-threads=2 \
            validate:: archive3tz:: c2_oracle_parity i1_oracle_parity
      - name: Independently check validation controls and finite work
        run: |
          python3 -B tests/c1_validation_oracle.py --generate "${{ runner.temp }}/c1-fixtures" --binary target/debug/rusty-tiles --output "${{ runner.temp }}/c1-validation.json"
          python3 -B bench/architecture_audit/c1/resource_probe.py --binary target/debug/rusty-tiles --work "${{ runner.temp }}/c1-resources" --output "${{ runner.temp }}/c1-resources.json"
          python3 -B tests/c1_producer_alignment.py --binary target/debug/rusty-tiles --work "${{ runner.temp }}/c1-producer" --output "${{ runner.temp }}/c1-producer.json"
          python3 -B tests/archive_read_oracle.py --binary target/debug/rusty-tiles --work "${{ runner.temp }}/archive-read-corpus" --output "${{ runner.temp }}/c1-archive-read.json"
          python3 -B tests/payload_integrity_oracle.py --binary target/debug/rusty-tiles --work "${{ runner.temp }}/payload-integrity-corpus" --output "${{ runner.temp }}/c1-payload-integrity.json"
          python3 -B tests/payload_meshopt_stride_oracle.py --binary target/debug/rusty-tiles --work "${{ runner.temp }}/payload-stride-corpus" --output "${{ runner.temp }}/c1-payload-stride.json"
          python3 -B bench/architecture_audit/vs_c_limits/hostile/rows_control.py check --binary target/debug/rusty-tiles --work "${{ runner.temp }}/hostile-rows"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c1-validation-evidence
          path: |
            ${{ runner.temp }}/c1-*.json
            ${{ runner.temp }}/c1-library.log
          if-no-files-found: error
      - name: Independently verify exact model bytes and original-node bounds
        run: python3 -B tests/model_wrapping_oracle.py --binary target/debug/rusty-tiles --json-output "${{ runner.temp }}/f1c2-wrapping.json"
      - name: Retain model wrapping evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1c2-identity-evidence
          path: ${{ runner.temp }}/f1c2-*.json
          if-no-files-found: error
      - name: Independently verify vector acceptance and archive inventory
        run: python3 -B tests/vector_acceptance_oracle.py --binary target/debug/rusty-tiles --evidence "${{ runner.temp }}/vector-acceptance"
      - name: Independently verify point records, rendered placement and hierarchy
        run: python3 -B tests/p1_point_oracle.py --binary target/debug/rusty-tiles --output-dir "${{ runner.temp }}/point-acceptance" --json-output "${{ runner.temp }}/point-acceptance.json"
      - name: Check source packaging
        run: cargo package --locked --no-verify

  python-wheel:
    name: Python wheel (CPython ${{ matrix.python }})
    needs: changes
    # Skipped jobs satisfy required checks; a failed classifier runs everything.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25 # versions: TIMEOUT_PYTHON_WHEEL
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14'] # versions: PYTHON_MIN PYTHON_MAX
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check wheel acceptance failure handling
        run: python -m unittest discover -s tests -p test_wheel_runners.py -v
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: python-wheel-${{ matrix.python }}
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      - name: Check Python bindings
        run: cargo clippy --locked -p rusty-tiles-python -- -D warnings
      - name: Test Python error and recovery mappings
        run: cargo test --locked -p rusty-tiles-python
      - name: Build wheel
        run: |
          python -m pip install 'maturin==1.15.0' # versions: MATURIN_VERSION
          maturin build --release --locked --out target/wheels
      - name: Build the CLI for CLI/Python parity
        run: cargo build --locked
      - name: Test the installed wheel with an empty PATH
        run: python scripts/test_python_wheel.py target/wheels/*.whl
        env:
          RUSTY_TILES_BIN: ${{ github.workspace }}/target/debug/rusty-tiles

  # The version this run's archives and wheels carry (scripts/dev_version.py build): the
  # committed one on main and in pull requests, the development version on develop and other
  # branches. Its ci-build-<version> artifact lets release.yml and dev-build.yml reuse them.
# The fast tier runs it too, for the Windows portable job.
  version:
    name: Build version
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # versions: TIMEOUT_SHORT
    outputs:
      version: ${{ steps.version.outputs.version }}
      python-version: ${{ steps.version.outputs.python-version }}
      kind: ${{ steps.version.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Resolve the build version
        env:
          REF: ${{ github.ref }}
        run: |
          set -eu
          python3 scripts/dev_version.py build "$REF" | tee -a "$GITHUB_OUTPUT" | tee build.txt
          python3 -c 'import json, sys; print(json.dumps(dict(line.split("=", 1) for line in open("build.txt").read().split()) | {"commit": sys.argv[1], "run": sys.argv[2]}, indent=2))' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > ci-build.json
          cat ci-build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-build-${{ steps.version.outputs.version }}
          path: ci-build.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }} # versions: ARTIFACT_RETENTION_DAYS_MAIN ARTIFACT_RETENTION_DAYS

  portable:
    name: Portable CLI (${{ matrix.target }})
    needs: [changes, version]
    # Skipped jobs satisfy required checks; a failed classifier runs everything. The fast tier
    # runs the Windows target only (see the matrix).
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    # The nightly run tests the whole suite on every target and builds the release archive.
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' && inputs.nightly) && 120 || 90 }} # versions: TIMEOUT_PORTABLE_NIGHTLY TIMEOUT_PORTABLE
    strategy:
      fail-fast: false
      matrix:
        # `slow`: Windows, the slowest remaining runner with `cargo test` (about 38 minutes).
        # On pull requests, pushes and manual runs it uses the nextest `portable` profile
        # (.config/nextest.toml), which runs tests in parallel across binaries and leaves the
        # long platform-independent acceptance suites to the other three targets. The
        # nightly run (nightly=true) runs the whole `cargo test` suite on all four targets,
        # so every platform still runs every test daily. Intel macOS is not a target from
        # 0.4.1.
        # The fast tier (full == 'false') runs Windows only, the platform the Linux jobs cover
        # least, so Windows breakage shows on its pull request; the full tier runs all four.
        # A matrix `include` cannot drop rows, so the tier picks one of two complete lists.
        include: >-
          ${{ fromJSON(needs.changes.outputs.full == 'false' && '[
          {"os": "windows-2022", "target": "x86_64-pc-windows-msvc", "slow": true}
          ]' || '[
          {"os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "slow": false},
          {"os": "ubuntu-22.04-arm", "target": "aarch64-unknown-linux-gnu", "slow": false},
          {"os": "macos-15", "target": "aarch64-apple-darwin", "slow": false},
          {"os": "windows-2022", "target": "x86_64-pc-windows-msvc", "slow": true}
          ]') }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      # 'true' only for a slow target outside the nightly run.
      SLOW: ${{ matrix.slow && !(github.event_name == 'workflow_dispatch' && inputs.nightly) }}
      BUILD_VERSION: ${{ needs.version.outputs.version }}
      PYTHON: ${{ startsWith(matrix.os, 'windows') && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "$RELEASE_TARGET"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: portable-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        if: env.SLOW == 'true'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148 # versions: NEXTEST_VERSION
      - name: Test the portable release CLI
        run: |
          set -eu
          if [ "$SLOW" = true ]; then
            echo "Fast portable mode: nextest portable profile (without hlod_acceptance), then doctests."
            cargo nextest run --locked --no-fail-fast --target "$RELEASE_TARGET" --profile portable --no-tests=fail
            cargo test --locked --target "$RELEASE_TARGET" --doc
          else
            # Every target in the nightly run, and the fast targets always: the whole suite.
            echo "Whole suite: cargo test, hlod_acceptance included."
            cargo test --locked --no-fail-fast --target "$RELEASE_TARGET" 2>&1 | tee "$RUNNER_TEMP/portable-tests.log"
            grep -Eq 'Running tests[/\\]hlod_acceptance\.rs' "$RUNNER_TEMP/portable-tests.log" \
              || { echo "::error::cargo test did not run tests/hlod_acceptance.rs"; exit 1; }
          fi
      - name: Report vendored KTX2 encoder digests and round trips
        run: cargo test --locked --target "$RELEASE_TARGET" --lib basisu_ktx2 -- --nocapture --test-threads=1
      # The release archive of this commit: release.yml and dev-build.yml publish it as is.
      # Stamped after the tests and the cache step, so neither sees the development version.
      - name: Set the build version
        run: '"$PYTHON" scripts/dev_version.py stamp "$BUILD_VERSION"'
      - name: Build, package and smoke test the release CLI
        run: |
          set -eu
          cargo build --locked --release --target "$RELEASE_TARGET"
          suffix=
          if [[ "$RELEASE_TARGET" == *windows* ]]; then suffix=.exe; fi
          scripts/package_cli.sh "$RELEASE_TARGET" "$BUILD_VERSION" "target/$RELEASE_TARGET/release/rusty-tiles$suffix" dist
          scripts/smoke_cli.sh "$RELEASE_TARGET" "$BUILD_VERSION" dist/rusty-tiles-"$BUILD_VERSION-$RELEASE_TARGET".*
      # The hash of the archive as built here; a release that reuses it checks it first.
      - name: Record the archive's SHA-256
        run: '"$PYTHON" scripts/sha256s.py write "sums/$RELEASE_TARGET.sha256" dist/*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }} # versions: ARTIFACT_RETENTION_DAYS_MAIN ARTIFACT_RETENTION_DAYS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sha256-binary-${{ matrix.target }}
          path: sums/*.sha256
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }} # versions: ARTIFACT_RETENTION_DAYS_MAIN ARTIFACT_RETENTION_DAYS

  encoder-link:
    name: KTX2 encoder link (${{ matrix.target }})
    # Full tier only; see "CI tiers" in CONTRIBUTING.md.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.full != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # versions: TIMEOUT_ENCODER_LINK
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "$RELEASE_TARGET"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: encoder-link-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      - name: Check stdio isolation and measure encoder link size
        run: |
          mkdir -p "$RUNNER_TEMP/encoder-link"
          scripts/basisu_link_check.sh "$RELEASE_TARGET" "$RUNNER_TEMP/encoder-link/$RELEASE_TARGET.json"
          { echo '```json'; cat "$RUNNER_TEMP/encoder-link/$RELEASE_TARGET.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain encoder link evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encoder-link-${{ matrix.target }}
          path: ${{ runner.temp }}/encoder-link/*.json
          if-no-files-found: error

  native-geospatial:
    name: Native geospatial (GDAL ${{ matrix.gdal }})
    needs: changes
    # Skipped jobs satisfy required checks; a failed classifier runs everything.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # versions: TIMEOUT_NATIVE
    strategy:
      fail-fast: false
      matrix:
        # The fast tier runs the newest GDAL only; the full tier runs both.
        gdal: ${{ fromJSON(needs.changes.outputs.full == 'false' && '["3.13"]' || '["3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Free runner disk
        # Hosted runners start with ~20 GB free; large test links fail with
        # "ld terminated with signal 7 [Bus error]" when it runs out. Remove
        # preinstalled toolchains these jobs never use.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/julia* /usr/share/swift
          df -h /
      - name: Install binding build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libclang-dev libsqlite3-dev
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: native-geospatial
          create-args: >-
            libgdal-core=${{ matrix.gdal }}
            proj>=9.2
            -c conda-forge
          init-shell: bash
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: gdal-${{ matrix.gdal }}
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      - name: Test native geospatial build
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '1'
          FULL: ${{ needs.changes.outputs.full }}
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          if [ "$FULL" = false ]; then
            # Fast tier: only what compiles differently with GDAL (the modules gated by
            # `native-geospatial` and every integration suite with GDAL-specific cases).
            # The Rust job already runs everything else; the full tier runs it all with GDAL.
            cargo test --locked --features native-geospatial --lib -- \
              crs dir_sync doctor raster runtime terrain vec3 vector source_crs
            cargo test --locked --features native-geospatial --bins \
              --test 'native_*' --test 'raster_*' --test 'point_*' --test '*vector*' --test '*terrain*' \
              --test cli_contract --test demodata_suite --test golden --test machine_results --test h26_mesh_frontends
          else
            cargo test --locked --features native-geospatial
          fi
      - name: Independently verify native vector and point acceptance
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 -B tests/vector_acceptance_oracle.py --binary target/debug/rusty-tiles --evidence "${{ runner.temp }}/vector-acceptance-native" --native
          python3 -B tests/p1_point_oracle.py --binary target/debug/rusty-tiles --output-dir "${{ runner.temp }}/point-acceptance-native" --json-output "${{ runner.temp }}/point-acceptance-native.json"
      - name: Check native geospatial lint
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '1'
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          rustup component add clippy
          cargo clippy --locked --all-targets --features native-geospatial -- -D warnings

  crs-allowlist:
    name: CRS allow-list regeneration
    needs: changes
    # Full tier only: about 15 minutes of GDAL sampling and a release lib-test build. Fast-tier
    # pull requests check the committed table, its parser and GDAL reference fixtures in `Rust`.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # versions: TIMEOUT_CRS_ALLOWLIST
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the table's GDAL and PROJ versions
        id: pins
        run: python3 -I scripts/crs-allowlist/generate.py versions | tee -a "$GITHUB_OUTPUT"
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: crs-allowlist
          create-args: >-
            python=3.13
            gdal=${{ steps.pins.outputs.gdal }}
            libgdal-core=${{ steps.pins.outputs.gdal }}
            proj=${{ steps.pins.outputs.proj }}
            -c conda-forge
          init-shell: bash
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: crs-allowlist
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      - name: Regenerate the EPSG allow-list and fail on drift or any code over 1 mm
        shell: bash -el {0}
        run: python -I scripts/crs-allowlist/generate.py check --summary "${{ runner.temp }}/crs-allowlist-summary.json"
      - name: Retain the regeneration summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crs-allowlist-summary
          path: ${{ runner.temp }}/crs-allowlist-summary.json
          if-no-files-found: ignore

  python:
    name: Python
    needs: changes
    # Skipped jobs satisfy required checks; a failed classifier runs everything.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # versions: TIMEOUT_PYTHON
    env:
      RUSTY_TILES_REQUIRE_BIN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: derivatives
          create-args: >-
            python=3.12
            gdal=3.12
            numpy=2
            laspy>=2.6,<3
            lazrs-python
            pyproj>=3.7,<4
            -c conda-forge
          init-shell: bash
      - name: Install binding build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libsqlite3-dev
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: python-gdal-3.12
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      - name: Build CLI for derivative acceptance
        env:
          LIBSQLITE3_SYS_USE_PKG_CONFIG: '1'
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo build --locked --features native-geospatial
      - name: Independently prove D1 raster pixels and directory closure
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 -B tests/d1_raster_oracle.py target/debug/rusty-tiles
          python3 -B tests/d2_directory_oracle.py target/debug/rusty-tiles
      - name: Test derivative encoding and preview isolation
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python -c "from osgeo import gdal; print(gdal.VersionInfo('--version'))"
          RUSTY_TILES_BIN="$PWD/target/debug/rusty-tiles" python -m unittest discover -s tests -p 'test_*.py'
      # ci/browser/package-lock.json pins Cesium, three.js, Playwright and the glTF validator by
      # integrity hash; npm's download cache is keyed by the lock.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22' # versions: NODE_VERSION
          cache: npm
          cache-dependency-path: ci/browser/package-lock.json
      # Playwright picks the Chromium build from its own version, which the lock pins.
      - name: Cache Playwright's Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/browser/package-lock.json') }}
      - name: Install pinned terrain consumer
        run: |
          mkdir -p target/terrain-browser
          cp ci/browser/package.json ci/browser/package-lock.json target/terrain-browser/
          npm ci --prefix target/terrain-browser --no-audit --no-fund \
            || { sleep 30; npm ci --prefix target/terrain-browser --no-audit --no-fund; }
          # The runner image already carries Chromium's libraries; apt only adds fonts and minor
          # upgrades, and the Azure Ubuntu mirror has stalled for minutes per package. Bound it.
          timeout 180 target/terrain-browser/node_modules/.bin/playwright install-deps chromium \
            || echo "::warning::playwright install-deps did not finish; using the runner image's libraries"
          target/terrain-browser/node_modules/.bin/playwright install chromium
      - name: Independently verify validator positive geometry controls
        run: python3 -B tests/c1_khronos_oracle.py --node-modules target/terrain-browser/node_modules --output "${{ runner.temp }}/c1-official-positive.json"
      - name: Prove terrain rendering, queries, clamping and imagery draping
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          CHROMIUM=$(node -e "console.log(require('./target/terrain-browser/node_modules/playwright').chromium.executablePath())")
          export CHROMIUM
          python3 -B tests/t1_terrain_viewer.py --binary target/debug/rusty-tiles \
            --cesium-dir target/terrain-browser/node_modules/cesium/Build/Cesium \
            --node-modules target/terrain-browser/node_modules \
            --json-output "${{ runner.temp }}/terrain-browser.json"
      - name: Prove unchanged model traversal, resources and placement
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          CHROMIUM=$(node -e "console.log(require('./target/terrain-browser/node_modules/playwright').chromium.executablePath())")
          export CHROMIUM
          python3 -B bench/architecture_audit/f1c2/review_probes/unchanged_model_browser.py \
            --binary target/debug/rusty-tiles --node-modules target/terrain-browser/node_modules \
            --chromium "$CHROMIUM" --output "${{ runner.temp }}/f1c2-wrapping-browser.json"
      - name: Retain model consumer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1c2-browser-evidence
          path: ${{ runner.temp }}/f1c2-*.json
          if-no-files-found: error
      - name: Independently verify native LAZ delivery
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python -B tests/p1_laz_adapter.py --binary "$PWD/target/debug/rusty-tiles" --json-output "${{ runner.temp }}/point-laz-native.json"
      - name: Upload terrain consumer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terrain-browser-evidence
          path: ${{ runner.temp }}/terrain-browser.json
          if-no-files-found: error
      - name: Test portable vectors against independent fixtures and Python oracle
        shell: bash -el {0}
        run: |
          cargo build --locked
          RUSTY_TILES_BIN="$PWD/target/debug/rusty-tiles" python -m unittest discover -s tests -p 'test_vector_*.py'
          RUSTY_TILES_BIN="$PWD/target/debug/rusty-tiles" python -m unittest discover -s tests -p 'test_native_vector.py'
          python -B tests/p1_laz_adapter.py --binary "$PWD/target/debug/rusty-tiles" --json-output "${{ runner.temp }}/point-laz-portable.json"
      - name: Pair point CLI and installed Python results
        shell: bash -el {0}
        run: |
          python -m pip install maturin==1.15.0 # versions: MATURIN_VERSION
          maturin build --locked --profile dev --out "${{ runner.temp }}/point-wheel"
          python -m pip install --no-deps "${{ runner.temp }}"/point-wheel/*.whl
          python -B tests/p1_point_frontends.py --binary "$PWD/target/debug/rusty-tiles" --json-output "${{ runner.temp }}/point-frontends.json"

  python-free-runtime:
    name: Python-free runtime
    needs: changes
    # Skipped jobs satisfy required checks; a failed classifier runs everything.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # versions: TIMEOUT_CONTAINER
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # The pinned GDAL/PROJ base image, or a source build from tarballs cached in Actions.
      - id: geobase
        uses: ./.github/actions/geobase
        with:
          github-token: ${{ github.token }}
      - name: Build and check packaged runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          load: true
          tags: rusty-tiles:native
          build-args: ${{ steps.geobase.outputs.build-args }}
          build-contexts: ${{ steps.geobase.outputs.build-contexts }}
          cache-from: type=gha,scope=python-free-acceptance
          cache-to: type=gha,scope=python-free-acceptance,mode=max
      - name: Test packaged conversions without Python or network access
        run: |
          docker run --rm --network none \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount type=bind,src="$PWD/tests/fixtures",dst=/fixtures,readonly \
            --mount type=bind,src="$PWD/scripts/test-packaged-runtime.sh",dst=/test-packaged-runtime.sh,readonly \
            --entrypoint /bin/sh rusty-tiles:native /test-packaged-runtime.sh /fixtures

  # Browser probes of the release route: nightly and manual runs, and pushes to main, so the
  # run that gates a release tag has passed them.
  release-acceptance:
    name: Release acceptance
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # versions: TIMEOUT_RELEASE_ACCEPTANCE
    env:
      ACCEPTANCE_REQUIRE_BROWSER: '1'
      ACCEPTANCE_WORK: ${{ github.workspace }}/target/release-acceptance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install binding build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libclang-dev libsqlite3-dev curl
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: release-acceptance
          create-args: >-
            python=3.12
            gdal=3.12
            numpy=2
            laspy>=2.6,<3
            lazrs-python
            pyproj>=3.7,<4
            -c conda-forge
          init-shell: bash
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22' # versions: NODE_VERSION
          cache: npm
          cache-dependency-path: ci/browser/package-lock.json
      # Playwright picks the Chromium build from its own version, which the lock pins.
      - name: Cache Playwright's Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/browser/package-lock.json') }}
      - name: Install pinned browser acceptance runtime
        run: |
          mkdir -p target/release-browser
          cp ci/browser/package.json ci/browser/package-lock.json target/release-browser/
          npm ci --prefix target/release-browser --no-audit --no-fund \
            || { sleep 30; npm ci --prefix target/release-browser --no-audit --no-fund; }
          # The runner image already carries Chromium's libraries; apt only adds fonts and minor
          # upgrades, and the Azure Ubuntu mirror has stalled for minutes per package. Bound it.
          timeout 180 target/release-browser/node_modules/.bin/playwright install-deps chromium \
            || echo "::warning::playwright install-deps did not finish; using the runner image's libraries"
          target/release-browser/node_modules/.bin/playwright install chromium
          echo "NODE_PATH=$PWD/target/release-browser/node_modules" >> "$GITHUB_ENV"
          echo "CESIUM_DIR=$PWD/target/release-browser/node_modules/cesium/Build/Cesium" >> "$GITHUB_ENV"
          acceptance_chromium=$(node -e "console.log(require('./target/release-browser/node_modules/playwright').chromium.executablePath())")
          echo "CHROMIUM=$acceptance_chromium" >> "$GITHUB_ENV"
      - name: Check release acceptance failure handling
        run: python3 -m unittest discover -s tests -p test_release_acceptance.py -v
      - name: Check the release CLI route
        shell: bash -el {0}
        run: |
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          scripts/release_acceptance.sh
      - name: Retain release acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-acceptance
          path: target/release-acceptance
          if-no-files-found: warn

  # Installed wheels on four platforms and the official Blender check. It is a reusable
  # workflow so release.yml can run the same jobs, and so one CI run covers the whole matrix.
  wheel-acceptance:
    name: Wheel acceptance
    needs: [changes, version]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.full != 'false' }}
    uses: ./.github/workflows/wheel-acceptance.yml
    with:
      # The separate distribution Blender check runs for nightly and manual runs only.
      test-blender: ${{ github.event_name == 'workflow_dispatch' }}
      # The wheels a release or dev build of this commit reuses (see the version job).
      version: ${{ needs.version.outputs.version }}
      retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }} # versions: ARTIFACT_RETENTION_DAYS_MAIN ARTIFACT_RETENTION_DAYS

  # One verdict for the full tier. release.yml requires this job (and Rust) to have succeeded
  # in a push, nightly or manual run for the tagged commit; a pull-request run never counts
  # there (scripts/ci_run.py). Pull requests that run the full tier (always those into main)
  # get the verdict too, so it can be a required check for develop -> main.
  full-matrix:
    name: Full matrix
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.full != 'false') }}
    needs:
      - changes
      - docs
      - version
      - rust
      - python-wheel
      - portable
      - encoder-link
      - native-geospatial
      - crs-allowlist
      - python
      - python-free-runtime
      - wheel-acceptance
      - release-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # versions: TIMEOUT_SHORT
    steps:
      - name: Require every job to have passed or been skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          set -eu
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          if printf '%s\n' "$NEEDS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::at least one full-tier job did not pass"
            exit 1
          fi
          # Docs-only changes skip the matrix by design; anything else must have run it.
          if [ "$DOCS_ONLY" != true ]; then
            printf '%s\n' "$NEEDS" | jq -e '.rust.result == "success" and .version.result == "success" and .python.result == "success" and .portable.result == "success" and .["native-geospatial"].result == "success" and .["crs-allowlist"].result == "success" and .["wheel-acceptance"].result == "success"' >/dev/null \
              || { echo "::error::a required full-tier job was skipped"; exit 1; }
          fi

  # After a nightly full-tier pass on develop, start the rolling dev build (dev-build.yml).
  # It runs as its own workflow, so a publishing problem cannot fail the full tier, and it
  # rebuilds only if develop moved since the last dev build. Nightly runs on other branches
  # (nightly.yml also tests the next patch release's integration branch) never start it.
  dev-build:
    name: Start the dev build
    needs: [full-matrix, rust]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch' &&
      inputs.nightly && needs.full-matrix.result == 'success' && needs.rust.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # versions: TIMEOUT_SHORT
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch dev-build.yml on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run dev-build.yml --ref develop

  # Keeps one open issue per branch, "Full CI matrix failing on <branch>", while the full tier
  # fails there (pushes to develop, and nightly runs on any branch nightly.yml dispatches) and
  # closes it on the next fully green run. Only this job can write issues.
  tracking-issue:
    name: Full CI tracking issue
    needs: [full-matrix, rust]
    if: >-
      ${{ !cancelled() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.nightly)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # versions: TIMEOUT_SHORT
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.sha }}
          VERDICT: ${{ needs.full-matrix.result }}
          RUST: ${{ needs.rust.result }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          title="Full CI matrix failing on $BRANCH"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | sort_by(.number) | .[0].number // empty")
          case "$VERDICT" in
            failure)
              failed=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" \
                --jq '.jobs[] | select(.conclusion == "failure" and .name != "Full matrix") | "- " + .name' | sort -u)
              body=$(printf 'Run: %s\nEvent: %s\nCommit: %s\n\nFailed jobs:\n\n%s\n' "$RUN_URL" "$RUN_EVENT" "$RUN_SHA" "$failed")
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "$body"
              else
                gh issue create --title "$title" --body "$body"
              fi
              ;;
            success)
              # A docs-only run skips the matrix, so only a run that built and tested the code closes it.
              if [ -n "$number" ] && [ "$RUST" = success ]; then
                gh issue close "$number" --comment "The full matrix passed in $RUN_URL ($RUN_SHA)."
              fi
              ;;
            *)
              echo "Run was cancelled or skipped; leaving the tracking issue as it is."
              ;;
          esac
