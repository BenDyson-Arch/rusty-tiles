          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 -B tests/f1b3_khronos.py --binary target/debug/rusty-tiles \
            --validator-modules target/terrain-browser/node_modules --source-commit "${{ github.sha }}" \
            --json-output "${{ runner.temp }}/f1b-core-pbr-khronos.json"
      - name: Validate source identity leaves and format controls with Khronos
        shell: bash -el {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 -B tests/f1c2_khronos.py --binary target/debug/rusty-tiles \
            --validator-modules target/terrain-browser/node_modules \
            --json-output "${{ runner.temp }}/f1c2-khronos.json"
      - name: Prove native root proxy artifacts and official core format
