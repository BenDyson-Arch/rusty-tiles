name: Release build

# The four-platform CLI archives, the four Python wheels and the Linux amd64 native image of
# one version. release.yml calls it for a vX.Y.Z tag or a dry run, and dev-build.yml for the
# rolling dev build; publishing is left to the caller.
#
# Build once (#346): when the caller passes `ci-run-id`, a full-matrix ci.yml run of this
# commit that built this version, the archives and wheels are taken from that run, which
# tested them, and only smoke-tested here on their own platforms. Without it (no such run, or
# its artifacts expired), or when taking them from that run fails, they are built and tested
# from source as before: `cargo test` and the release build for each archive, and full wheel
# acceptance for the wheels. Either way the caller gets `binary-<target>` and `wheel-*`
# artifacts in this run. The image is always built here and pushed as
# ghcr.io/<repository>:<image-tag> when a tag is given.
#
# Every reused file is checked against the SHA-256 the CI job recorded when it built it (the
# sha256-binary-<target> and sha256-wheel-<target> artifacts) before any smoke test or upload;
# a mismatch fails the release. Reading another run's artifacts needs `actions: read`; only the two jobs that do it get it,
# and the caller's job must grant it.
on:
  workflow_call:
    inputs:
      version:
        description: Cargo version to publish; stamped into the checkout if it is not the committed one
        type: string
        required: true
      image-tag:
        description: GHCR image tag to push, such as v0.4.0 or dev; empty builds and tests without pushing
        type: string
        default: ''
      ci-run-id:
        description: ci.yml run whose tested archives and wheels to reuse; empty builds them here
        type: string
        default: ''

permissions:
  contents: read

jobs:
  binaries:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Long enough for the build from source, which a failed download can still lead to.
    timeout-minutes: 90 # versions: TIMEOUT_FALLBACK_BUILD
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      PYTHON: ${{ startsWith(matrix.os, 'windows') && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: take
        name: Take the archive the CI run tested
        if: inputs.ci-run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binary-${{ matrix.target }}
          path: dist
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      # The SHA-256 the CI job recorded when it built the archive (scripts/sha256s.py).
      - id: take-sums
        name: Take the archive's SHA-256 from the CI run
        if: inputs.ci-run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sha256-binary-${{ matrix.target }}
          path: sums
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      - id: source
        name: Reuse the CI archive or build from source
        env:
          CI_RUN: ${{ inputs.ci-run-id }}
          TAKEN: ${{ steps.take.outcome }}
          TAKEN_SUMS: ${{ steps.take-sums.outcome }}
        run: |
          set -eu
          shopt -s nullglob
          taken=(dist/rusty-tiles-"$RELEASE_VERSION-$RELEASE_TARGET".*)
          sums=(sums/*.sha256)
          if [ -z "$CI_RUN" ]; then
            echo "No reusable CI run: building and testing from source."
            echo 'build=true' >> "$GITHUB_OUTPUT"
          elif [ "$TAKEN" = success ] && [ "${#taken[@]}" -eq 1 ] && [ "$TAKEN_SUMS" = success ] && [ "${#sums[@]}" -ge 1 ]; then
            echo "Reusing binary-$RELEASE_TARGET from CI run $CI_RUN."
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not take binary-$RELEASE_TARGET of version $RELEASE_VERSION and its SHA-256 from CI run $CI_RUN (downloads $TAKEN, $TAKEN_SUMS); building and testing it from source instead."
            rm -rf dist sums
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      # A downloaded archive that differs from what CI built fails the release.
      - name: Check the archive against CI's SHA-256
        if: steps.source.outputs.build == 'false'
        run: '"$PYTHON" scripts/sha256s.py check --dir dist sums/*.sha256'
      - name: Select stable Rust
        if: steps.source.outputs.build == 'true'
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "$RELEASE_TARGET"
      - name: Cache Rust dependencies
        if: steps.source.outputs.build == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: portable-${{ matrix.target }}
          save-if: false
      # After the cache step, so its key comes from the committed Cargo files.
      - name: Set the build version
        if: steps.source.outputs.build == 'true'
        run: '"$PYTHON" scripts/dev_version.py stamp "$RELEASE_VERSION"'
      - name: Build, test and package the default CLI
        if: steps.source.outputs.build == 'true'
        run: |
          # Peak-RSS slack in this test is sensitive to shared runner load; CI runs it
          # for the same source, so it does not gate publication here.
          cargo test --locked --target "$RELEASE_TARGET" -- \
            --skip spill::tests::spill_memory_is_flat_in_input_size
          cargo build --locked --release --target "$RELEASE_TARGET"
          suffix=
          if [[ "$RELEASE_TARGET" == *windows* ]]; then suffix=.exe; fi
          scripts/package_cli.sh "$RELEASE_TARGET" "$RELEASE_VERSION" "target/$RELEASE_TARGET/release/rusty-tiles$suffix" dist
      - name: Smoke test the archive
        run: |
          set -eu
          files=(dist/*)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 1
          scripts/smoke_cli.sh "$RELEASE_TARGET" "$RELEASE_VERSION" dist/rusty-tiles-"$RELEASE_VERSION-$RELEASE_TARGET".*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Builds and tests the wheels from source when there is no CI run to reuse, or when taking
  # its wheels failed (wheels-from-ci then reports reused=false).
  wheels:
    name: Python wheel acceptance
    needs: wheels-from-ci
    if: ${{ !cancelled() && (inputs.ci-run-id == '' || needs.wheels-from-ci.outputs.reused == 'false') }}
    uses: ./.github/workflows/wheel-acceptance.yml
    with:
      version: ${{ inputs.version }}

  wheels-from-ci:
    name: Python wheels from CI
    if: inputs.ci-run-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # versions: TIMEOUT_SMOKE
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.source.outputs.reused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14' # versions: PYTHON_MAX
      # The CI run built these wheels and passed them through installed-wheel and official
      # Blender acceptance on every platform; this checks the set and one install.
      - id: take
        name: Take the wheels the CI run tested
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      - id: take-sums
        name: Take the wheels' SHA-256s from the CI run
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sha256-wheel-*
          merge-multiple: true
          path: sums
          run-id: ${{ inputs.ci-run-id }}
          github-token: ${{ github.token }}
      # A failed download falls back to wheel acceptance from source (the wheels job); wheels
      # that downloaded but fail the checks below fail the release.
      - id: source
        name: Reuse the CI wheels or build from source
        env:
          CI_RUN: ${{ inputs.ci-run-id }}
          TAKEN: ${{ steps.take.outcome }}
          TAKEN_SUMS: ${{ steps.take-sums.outcome }}
        run: |
          set -eu
          if [ "$TAKEN" = success ] && [ "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -ge 1 ] \
            && [ "$TAKEN_SUMS" = success ] && [ "$(find sums -maxdepth 1 -type f -name '*.sha256' 2>/dev/null | wc -l)" -ge 1 ]; then
            echo "Reusing the wheels of CI run $CI_RUN."
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not take the wheels and their SHA-256s from CI run $CI_RUN (downloads $TAKEN, $TAKEN_SUMS); wheel acceptance will build and test them from source instead."
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check the wheel set and install the Linux x86_64 wheel
        if: steps.source.outputs.reused == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          # Every wheel must be byte-identical to what CI built; a mismatch fails the release.
          python scripts/sha256s.py check --dir dist sums/*.sha256
          python_version=$(python scripts/dev_version.py python "$RELEASE_VERSION")
          (cd dist && ls -1) | tee wheels.txt
          test "$(grep -c "^rusty_tiles-$python_version-cp310-abi3-.*\.whl\$" wheels.txt)" -eq 4
          test "$(wc -l < wheels.txt)" -eq 4
          python scripts/third_party_notices.py check --rust-licenses python dist/*.whl
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --no-index --no-deps dist/*manylinux*_x86_64.whl
          (cd "$RUNNER_TEMP" && smoke/bin/python -I -c 'import importlib.metadata as metadata, sys, rusty_tiles
          installed = metadata.version("rusty-tiles")
          assert rusty_tiles.__version__ == installed == sys.argv[1], (rusty_tiles.__version__, installed)
          print("rusty_tiles", installed)' "$python_version")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.source.outputs.reused == 'true'
        with:
          name: wheel-from-ci
          path: dist/*.whl
          if-no-files-found: error

  container:
    name: Native geospatial image (Linux amd64)
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # versions: TIMEOUT_FALLBACK_BUILD
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set the build version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/dev_version.py stamp "$RELEASE_VERSION"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # The pinned GDAL/PROJ base image, or a source build from tarballs cached in Actions.
      - id: geobase
        uses: ./.github/actions/geobase
        with:
          github-token: ${{ github.token }}
      - name: Build the packaged runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          load: true
          tags: rusty-tiles:release
          build-args: ${{ steps.geobase.outputs.build-args }}
          build-contexts: ${{ steps.geobase.outputs.build-contexts }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.image-tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=python-free-acceptance
          cache-to: type=gha,scope=python-free-acceptance,mode=max
      - name: Check and publish the Python-free runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          image="ghcr.io/${RELEASE_REPO,,}:${IMAGE_TAG:-unpublished}"
          docker tag rusty-tiles:release "$image"
          reported=$(docker run --rm --network none "$image" --version)
          echo "$reported"
          test "$reported" = "rusty-tiles $RELEASE_VERSION"
          # Directory publication refuses overlayfs, so /tmp is a tmpfs, as in CI (#373).
          docker run --rm --network none \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount type=bind,src="$PWD/tests/fixtures",dst=/fixtures,readonly \
            --mount type=bind,src="$PWD/scripts/test-packaged-runtime.sh",dst=/test-packaged-runtime.sh,readonly \
            --entrypoint /bin/sh "$image" /test-packaged-runtime.sh /fixtures
          if [ -z "$IMAGE_TAG" ]; then
            echo "No image tag: the image was tested and not pushed."
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
